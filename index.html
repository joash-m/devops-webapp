<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD WebApp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 60%;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DevOps CI/CD Web Application</h1>

        <p>
            Welcome to my automated DevOps deployment project.
        </p>

        <p class="status">
            CI/CD Pipeline is Working Successfully!
        </p>

        <p>
            GitHub → GitHub Actions → Slack → Vercel
        </p>

    </div>

</body>
</html>
<!-- CI/CD automated deployment test -->
